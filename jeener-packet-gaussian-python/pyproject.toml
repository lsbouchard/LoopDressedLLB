[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jeener-packet-gaussian"
version = "2026.7.9"
description = "Loop-dressed Jeener-cube packet solver with certified packet-mode Gaussian diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Louis-S. Bouchard" },
  { name = "Arianna Wu" }
]
keywords = [
  "Jeener cube",
  "spin dynamics",
  "Gaussian entanglement",
  "mesoscopic packets",
  "PRA reproducibility"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "matplotlib>=3.6"
]

[project.scripts]
jeener-packet-gaussian = "jeener_packet_gaussian.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]
